# 3D Print Shop Harm — reverse proxy for the Nuxt/Nitro app (PM2, port 5001).
# Install to: /etc/nginx/sites-available/3dpsh.conf   (provision.sh does this)
#
# The certificate lives under the -0001 lineage: an earlier certbot run already
# held the 3dps.space name, so the current cert was issued as a second lineage.
# Renewal is driven by /etc/letsencrypt/renewal/3dps.space-0001.conf
# (authenticator = standalone) and must not be re-issued from here.

# Redirect all HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 3dps.space www.3dps.space;

    # Keep the ACME path reachable over plain HTTP in case renewal is ever
    # switched from standalone to webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3dps.space www.3dps.space;

    ssl_certificate     /etc/letsencrypt/live/3dps.space-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dps.space-0001/privkey.pem;
    # Protocols and ciphers come from certbot's shared snippet.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Zone name must be unique server-wide (this box hosts many vhosts).
    ssl_session_cache   shared:3dpsh_SSL:10m;
    ssl_session_timeout 1d;

    # Security headers. HSTS deliberately without includeSubDomains —
    # board.3dps.space and nextcloud.3dps.space are separate vhosts and must not
    # be forced by this one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compression (Nitro does not pre-compress the proxied HTML/JSON).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    client_max_body_size 20m;

    # Hashed build assets are immutable — cache them hard.
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else: let Nuxt handle routing and static files.
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
