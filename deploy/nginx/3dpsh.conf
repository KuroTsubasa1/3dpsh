# 3D Print Shop Harm — reverse proxy for the Nuxt/Nitro app (PM2, port 5001).
# Install to: /etc/nginx/sites-available/3dpsh.conf
# Enable with: ln -s /etc/nginx/sites-available/3dpsh.conf /etc/nginx/sites-enabled/

# Redirect all HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 3dps.space www.3dps.space;

    # Allow Let's Encrypt HTTP-01 challenges to be served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3dps.space www.3dps.space;

    # TLS — managed by certbot (see DEPLOYMENT.md).
    ssl_certificate     /etc/letsencrypt/live/3dps.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dps.space/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Zone name must be unique server-wide (other vhosts use their own).
    ssl_session_cache   shared:3dpsh_SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression (the proxied HTML/JSON is not pre-compressed by Nitro).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 20m;

    # Hashed build assets are immutable — cache them hard.
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
